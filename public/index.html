<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/index.css">
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header class="site-header sticky-top">
        <nav class="navbar py-3">
            <div class="container-fluid px-3 px-md-4 px-lg-5">

                <!-- Placeholder logo: ganti isi .brand-logo dengan <img> saat logo sudah ada -->
                <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/">
                    <img src="assets/image.png" height="32" alt="TaskTracker logo">
                    <span>TaskTracker</span>
                </a>

                <div class="d-flex align-items-center gap-2">
                    <button id="themeToggle" class="btn btn-ghost btn-theme" aria-label="Toggle theme">🌙</button>
                    <a href="/login" class="btn btn-quiet">Login</a>
                    <a href="/register" class="btn btn-accent">Register</a>
                </div>

            </div>
        </nav>
    </header>

    <!-- ============ KONTEN UTAMA (belum diisi) ============ -->
    <main class="app-content">
    </main>

    <!-- ============ LOADING OVERLAY ============ -->
    <div id="loadingOverlay" class="loading-overlay" role="alertdialog"
        aria-modal="true" aria-live="polite" aria-hidden="true">
        <div class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Loading...</p>
        </div>
    </div>

    <script type="module" src="script/index_script.js"></script>
</body>
</html>


<!-- http://localhost:3000 -->
