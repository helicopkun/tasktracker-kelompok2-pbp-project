<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker |</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/task.css">
</head>
<body>

    <header class="site-header sticky-top">
        <nav class="navbar py-3">
            <div class="container-fluid px-3 px-md-4 px-lg-5">

                Placeholder

            </div>
        </nav>
    </header>

    <main>
    <!-- LIST VIEW: shown when there is no ?id= -->
    <section id="listView" class="task-section" hidden>
        <h1>Task</h1>
        <div class="task-container" id="taskContainer"></div>
        <p id="pesanTask">Loading...</p>
        <!-- your modal stays here -->
    </section>

    <!-- DETAIL VIEW: shown when the URL is /task?id=2 -->
    <section id="detailView" class="task-section" hidden>
        <a href="/home" class="btn btn-outline-light mb-3">&larr; Back</a>

        <div id="detailWarning" class="alert alert-warning" role="alert" hidden></div>

        <div id="detailContent">
            <h2 id="detailName"></h2>
            <p id="detailOwner"></p>
            <p id="detailDue"></p>
            <ul id="detailBody" class="list-unstyled"></ul>
            <button type="button" class="btn btn-outline-light mt-3" id="btnCopyLink">Copy link</button>
        </div>
    </section>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script/task_script.js"></script>
</body>
</html>
