<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskTracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/login.css">
</head>

<body class="login-page">
    <button id="themeToggle" class="btn btn-theme" aria-label="Toggle theme">🌙</button>
    <main class="login-wrap">
        <a href="/index">
            <img class="login-logo" src="assets/image.png" alt="TaskTracker logo">
        </a>
        <h1 class="login-title">Register for TaskTracker</h1>

        <form class="login-form card-surface" id="formRegister">
            <p id="pesan" class="form-message" role="status"></p>

            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="pwConfirm">Confirm Password</label>
                <input type="password" class="form-control" id="pwConfirm" required>
            </div>

            <button type="submit" id="btnRegister" class="btn btn-accent w-100">Register</button>
        </form>

        <p class="login-callout">
            Already have an existing account? <a href="/login">Here</a>
        </p>
    </main>

    <div id="loadingOverlay" class="loading-overlay" role="alertdialog"
        aria-modal="true" aria-live="polite" aria-hidden="true">
        <div class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Loading...</p>
        </div>
    </div>

    <script type="module" src="script/register_script.js"></script>
</body>
</html>
