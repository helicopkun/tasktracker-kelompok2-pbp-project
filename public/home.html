<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker | Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/home.css">
</head>
<body>

    <header class="site-header sticky-top">
        <nav class="navbar py-3">
            <div class="container-fluid px-3 px-md-4 px-lg-5">

                <div class="">
                    <p>Welcome, <span id="username"></span></p>
                    <button class="btn" id="btnLogout">Logout</button>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button id="themeToggle" class="btn btn-ghost btn-theme" aria-label="Toggle theme">🌙</button>
                </div>

            </div>
        </nav>
    </header>


<br><br><br>



    Table Team
    <table>
        <thead>
            <tr>
                <th>Team name</th>
            </tr>
        </thead>
        <tbody id="dataTeam"></tbody>
    </table>
    <p id="pesanTeamTABLE">Loading..</p>

<br><br><br>
    
    <section class="task-section">
        <h1>Task</h1>
        <button class="btn btn-outline-light" id="filterBtn">All</button>

        <div class="task-container" id="taskContainer">
            <button class="task-card card-surface is-interactive"
            data-bs-toggle="modal" data-bs-target="#taskModal">
                <p class="task-name">Task Name</p>
                <p class="task-owner">Owner/Team Name</p>
                <p class="task-due due">Due in N Days, Y Months</p>
                <p class="task-percentage">80%</p>
                <div class="progress" style="height: 6px">
                    <div class="progress-bar" style="width: 80%"></div>
                </div>
            </button>
        </div>
        <p id="pesanTask">Loading...</p>
        


        <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskName" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="taskName">Task..</h5>
                        <p class="modal-sm" id="taskOwner">By..</p>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="taskDetails" style="height: 300px; overflow-y: auto;">
                        <p style="color: var(--warning);">Task details</p>
                        <p style="color: var(--success);">Task details &check;</p>
                    </div>
                    <div class="modal-footer">
                        <p class="task-due modal-ver" id="taskDue">Due in..</p>
                        <button type="button" class="btn btn-primary" id="btnTaskDetail">View details</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

<br><br><br>
    

    <div id="loadingOverlay" class="loading-overlay" role="alertdialog"
        aria-modal="true" aria-live="polite" aria-hidden="true">
        <div class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Loading...</p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script/home_script.js"></script>
</body>
</html>
