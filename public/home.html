<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/home.css">
</head>
<body>
    <button id="themeToggle" class="btn btn-theme" aria-label="Toggle theme">🌙</button>

    Home page
    <p>Welcome, <span id="username"></span></p>
    <button id="btnLogout">Logout</button>

    <br>

    Add new task
    <form id="formNewtask">
        <input type="text" id="taskName" placeholder="Task name" required>
        <input type="datetime-local" id="due" placeholder="Due date">
        
        <button type="submit">Add task</button>
    </form>
    <p id="pesanNewtask"></p>


    <br><br><br>

    Table Task
    <table>
        <thead>
            <tr>
                <th>Task name</th>
                <th>due</th>
            </tr>
        </thead>
        <tbody id="dataTask"></tbody>
    </table>
    <p id="pesanData">Loading..</p>

    <div id="loadingOverlay" class="loading-overlay" role="alertdialog"
        aria-modal="true" aria-live="polite" aria-hidden="true">
        <div class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Loading...</p>
        </div>
    </div>
    
    <script type="module" src="script/home_script.js"></script>
</body>
</html>
